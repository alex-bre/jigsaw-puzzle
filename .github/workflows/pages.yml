name: Pages

# Deploys only when started by hand (Actions → Pages → Run workflow), so pushes
# to main do not change the live site. The game is a folder of static files
# with no backend, so the chosen branch is exactly what the site shows. Vite's
# `base: './'` keeps asset paths relative, so it works under /jigsaw-puzzle/.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it: a half-uploaded
# artifact is not a state the Pages deployment recovers from on its own.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      # `tsc --noEmit && vite build`: the build typechecks on its own.
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
